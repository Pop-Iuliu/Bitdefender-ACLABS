[package]
name = "BitdefenderACLABS"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
zip = "8.5.1"
anyhow = "1.0.102"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.32"